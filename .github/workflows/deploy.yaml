name: Build Book & Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          packages: |
            any::bookdown
            any::rmarkdown
            any::knitr
            any::downlit
            any::xml2

      - name: Build bookdown (HTML)
        working-directory: books/es/conferencias_miguel_anxo_bastos_vol_i/bookdown
        run: |
          Rscript -e "bookdown::render_book('index.Rmd', 'bookdown::bs4_book')"

      - name: Assemble deploy directory
        run: |
          mkdir -p _site/conferencias_vol_i
          # Landing page at root
          cp -r site/. _site/
          # Book HTML output under /conferencias_vol_i/
          cp -r books/es/conferencias_miguel_anxo_bastos_vol_i/bookdown/_book/. _site/conferencias_vol_i/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        if: github.event_name == 'push'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: miguelanxobastos
          directory: _site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
