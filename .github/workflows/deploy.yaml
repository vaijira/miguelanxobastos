name: Build Book & Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # To install LaTeX to build PDF book
          tinytex: true
          # uncomment below and fill to pin a version
          #version: 1.3.353

      - name: Build book (HTML)
        working-directory: books/es/conferencias_miguel_anxo_bastos_vol_i/quarto
        run: quarto render

      - name: Assemble deploy directory
        run: |
          mkdir -p _site/conferencias_vol_i
          # Landing page at root
          cp -r site/. _site/
          # Book HTML output under /conferencias_vol_i/
          cp -r books/es/conferencias_miguel_anxo_bastos_vol_i/quarto/_book/. _site/conferencias_vol_i/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        if: github.event_name == 'push'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: miguelanxobastos
          directory: _site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Install epubcheck
        run: sudo apt-get install epubcheck

      - name: Check epub with epubcheck
        run: epubcheck _book/Conferencias-de-Miguel-Anxo-Bastos,-Volumen-I.epub